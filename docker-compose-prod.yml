services:
  shuttle-backend:
    build: ./shuttle-backend
    container_name: spring-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - TZ=Asia/Kuala_Lumpur
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/shuttle_bus
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STORAGE_URL=${STORAGE_URL}
      - SECRET_KEY=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LOKI_URL=${LOKI_URL}
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
      
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      TZ: Asia/Kuala_Lumpur
      POSTGRES_DB: shuttle_bus
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d shuttle_bus" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_USERNAME}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_LISTEN_PORT: 80
    expose:
      - "80"
    depends_on:
      - postgres-db

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl/origin.pem:/etc/ssl/certs/origin.pem:ro
      - /etc/nginx/ssl/origin.key:/etc/ssl/private/origin.key:ro
    depends_on:
      - shuttle-backend

volumes:
  postgres_data:
